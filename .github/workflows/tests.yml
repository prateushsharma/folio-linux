name: Tests
on:
  push:
  pull_request:
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest
      - run: python -m compileall -q folio
      - run: python -m pytest -q
      - name: Qt offscreen smoke test
        env:
          QT_QPA_PLATFORM: offscreen
          XDG_DATA_HOME: /tmp/folio-ci-data
        run: python -m pytest -q tests/test_gui_smoke.py
