[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "folio-linux"
version = "0.1.0"
description = "An elegant, offline-first PDF reading and study workspace for Linux"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-only"}
authors = [{name = "Folio-Linux Contributors"}]
dependencies = ["PySide6-Essentials>=6.6,<7", "PyMuPDF>=1.23,<2"]

[project.optional-dependencies]
web = ["PySide6-Addons>=6.6,<7"]

[project.scripts]
folio = "folio.app:main"

[tool.setuptools.packages.find]
include = ["folio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
